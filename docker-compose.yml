# Local full stack: PostgreSQL + API + web.  `docker compose up --build`
# Copy backend/.env.example to backend/.env first and set JWT_SECRET (and optional provider keys).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omniscan
      POSTGRES_USER: omniscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omniscan-local-only}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniscan"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://omniscan:${POSTGRES_PASSWORD:-omniscan-local-only}@db:5432/omniscan
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: [uploads:/app/uploads]

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  uploads:
