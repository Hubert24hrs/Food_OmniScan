name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, tests, migrations, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt pip-audit
      - name: Lint
        run: ruff check app && ruff format --check app
      - name: Tests (external APIs mocked)
        run: python -m pytest
      - name: Migrations match models
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
        run: alembic upgrade head && alembic check
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  web:
    name: Web (types, lint, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8010/api/v1
      - run: npm audit --omit=dev

  e2e:
    name: End-to-end (Playwright, live Open Food Facts)
    runs-on: ubuntu-latest
    needs: [backend, web]
    env:
      ENVIRONMENT: development
      DATABASE_URL: sqlite:///./e2e.db
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      OFF_USER_AGENT: FoodOmniScan/0.1 (CI)
      NEXT_PUBLIC_API_URL: http://localhost:8010/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          nohup python -m uvicorn app.main:app --port 8010 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8010/health && break; sleep 1; done
      - name: Build and start web
        working-directory: web
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000 > /dev/null && break; sleep 1; done
      - name: Playwright
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --workers=1
      - name: Upload logs and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            api.log
            web.log
            web/test-results/

  mobile:
    name: Mobile (flutter analyze, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
